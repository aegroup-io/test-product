[project]
name = "orcha-api"
version = "0.1.0"
description = "API baseline service for Orcha"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "agent-core-platform-api",
  "psycopg[binary]>=3.1",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
agent-core-platform-api = { path = "../packages/platform-api", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

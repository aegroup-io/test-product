<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Starship in space</title>
  <desc id="desc">A static illustration of a silver starship flying past stars and a distant planet.</desc>
  <defs>
    <linearGradient id="space" x1="0" x2="1" y1="0" y2="1">

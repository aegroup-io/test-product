[project]
name = "agent-core-platform-worker"
version = "0.1.0"
description = "Shared worker runtime package for baseline job envelopes and handlers."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

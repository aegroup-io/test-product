[project]
name = "agent-core-platform-api"
version = "0.1.0"
description = "Shared API runtime package for auth, orgs, RBAC, settings, and secrets."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "python-jose[cryptography]>=3.3",
  "sqlalchemy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

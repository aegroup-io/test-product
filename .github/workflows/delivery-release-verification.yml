name: Delivery Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ hashFiles('.agent-core/delivery-release-verification.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run delivery release verification
        run: python3 scripts/run_delivery_release_verification.py
